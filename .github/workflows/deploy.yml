name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/football-academy-homepage-tr4DF
  workflow_dispatch:

# Permissions needed to push the built site to the gh-pages branch
permissions:
  contents: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a copy
      # of index.html lets deep links like /Beyondthegame/pathway boot the app.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      # Disable Jekyll so files/folders starting with _ are served as-is.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
