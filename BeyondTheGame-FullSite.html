title:"Leaving at 18 — your path is still wide open",text:"You've spent your teenage years training, sacrificing, believing — and now you're at a crossroads. It's okay to feel lost, angry, or sad about what you expected your life to look like. There's a lot more to you than football, even if it doesn't feel that way right now.",resources:[{icon:"🎓",title:"University & Higher Ed",text:"Sports science, coaching, physiotherapy, business — your academy background is a genuine asset on any UCAS or apprenticeship application."},{icon:"🔧",title:"Apprenticeships",text:"Earn while you learn in construction, tech, healthcare, business or sport. Employers actively seek the discipline ex-academy players bring."},{icon:"⚽",title:"Keep Playing",text:"Released from a pro academy doesn't mean football is over. We help you find semi-pro, amateur, and recreational clubs that fit your level and ambitions."}]},"21plus":{label:"21+",caption:"left the academy",title:"Years of dedication deserve a real next chapter",text:"You've given your early adult years to this game — and that took genuine sacrifice and belief. Those early mornings, team pressure, performing under stress: those aren't just football skills, they're exactly what employers and coaches look for. This is a transition, not an ending.",resources:[{icon:"🏆",title:"Coaching & Badges",text:"UEFA C, B, and A licences, grassroots coaching, academy roles — your playing experience is a massive head start. We'll help you get started."},{icon:"💼",title:"Career Pivot",text:"CV workshops, interview prep, and direct introductions to employers who actively recruit from professional sport backgrounds."},{icon:"💰",title:"Financial Planning",text:"Make the most of any savings, understand your tax position, and plan your next five years with a dedicated financial advisor who understands athletes."}]}},tf=[{id:"mind",emoji:"🧠",title:"Mind & Wellbeing",text:"Feeling low, anxious, or completely lost is a totally normal response to leaving the academy. We connect you with therapists and peer supporters who actually understand what you're going through — no waiting lists, no jargon.",accent:"var(--c-mind)",bg:"var(--c-mind-bg)"},{id:"money",emoji:"💷",title:"Money & Finances",text:"From benefits you might be entitled to, through budgeting basics, to longer-term financial planning — our guides are written in plain English with no confusing jargon. Know your rights and make your money work harder.",accent:"var(--c-money)",bg:"var(--c-money-bg)"},{id:"feelings",emoji:"❤️",title:"Feelings & Identity",text:"When football is your whole identity and it's suddenly gone, it can feel like losing a part of yourself. This isn't weakness — it's grief. We have peer groups and one-to-one support to help you find yourself beyond the game.",accent:"var(--c-feelings)",bg:"var(--c-feelings-bg)"},{id:"work",emoji:"🎯",title:"Work & Your Future",text:"CV writing, job searching, apprenticeship applications, interview practice — and honest conversations about what kind of work might actually make you happy. Your academy skills translate further than you think.",accent:"var(--c-work)",bg:"var(--c-work-bg)"},{id:"football",emoji:"⚽",title:"Football Exit Support",text:"Understand your rights, navigate the academy release process, get advice on agents and contracts, and explore whether continuing to play at any level is right for you. You don't have to figure this out alone.",accent:"var(--c-football)",bg:"var(--c-football-bg)"},{id:"community",emoji:"🤝",title:"Community & Mates",text:"Connect with hundreds of young people who've been through the same thing. Share your story, find answers, make real friends who understand what you've been through. You are far from alone in this.",accent:"var(--c-community)",bg:"var(--c-community-bg)"},{id:"academy",emoji:"🏆",title:"Life After Academy",text:"An in-depth guide covering the non-league pyramid, real player stories, the freedom player market, psychological literacy courses, and practical li youth development programmes.","Build a coaching portfolio: film your sessions, log CPD hours, collect player and parent feedback."],quals:["UEFA C Licence","UEFA B Licence","DBS Enhanced Check","FA Youth Award (Levels 1–3)"],opps:{text:"County FAs and grassroots academies hire part-time youth development coaches throughout the year. The FA also offers coaching bursaries for individuals from under-represented backgrounds who want to progress through the licence pathway.",links:[{label:"FA Jobs Board",url:"https://www.thefa.com/football-rules-governance/jobs"},{label:"County FA Coaching Opportunities",url:"https://www.thefa.com/football-rules-governance/county-fa"}]}},{title:"Sports Science / S&C Coach",badge:"PAID",badgeType:"paid",tagline:"You're in the gym and on the training pitch, building programmes that make players faster, stronger, and harder to injure.",steps:["Study a BSc in Sports Science or Strength & Conditioning — available full-time, part-time, or via degree apprenticeship.","Work towards UKSCA Accreditation (UK Strength and Conditioning Association) — the industry-standard credential.","Volunteer with a local academy or semi-pro team to build practical hours alongside your qualification."],quals:["BSc Sports Science","UKSCA Accreditation","Sports First Aid","DBS Enhanced Check"],opps:{text:"Non-league clubs from Step 3 upward are increasingly hiring S&C coaches, particularly for pre-season and injury rehabilitation. Many start as unpaid volunteers before transitioning to a matchday fee and eventually a part-time salary.",links:[{label:"UKSCA Job Board",url:"https://www.uksca.org.uk/careers"},{label:"Sportcareers.com",url:"https://www.sportcareers.com"}]}},{title:"PE Teacher",badge:"PAID",badgeType:"paid",tagline:"You're running football sessions, athletics days, and fitness classes — inspiring kids the same way a coach once inspired you.",steps:["Complete a PE-related undergraduate degree or BSc in Sports Science (3 years, or with foundation year).","Apply for a PGCE in Secondary Physical Education — government bursaries of up to £9,000 are available.","Consider School Direct or Teach First if you want to earn a salary while training in a real school."],quals:["PGCE Secondary Physical Education","QTS (Qualified Teacher Status)","DBS Enhanced Check"],opps:{text:"PE teachers are in consistent demand across UK state secondary schools. Academy experience is a genuine asset when applying — schools want teachers who can coach football to a high level, and your background sets you apart immediately.",links:[{label:"Get Into Teaching",url:"https://getintoteaching.education.gov.uk"},{label:"TES Jobs",url:"https://www.tes.com/jobs"}]}},{title:"Referee / Match Official",badge:"PAID",badgeType:"paid",tagline:"You're the authority on the pitch — making decisions under pressure every week and climbing the officiating ladder one match at a time.",steps:["Complete the FA Referee Course (Level 7 — around £100–120, delivered by your county FA, typically 2 days).","Officiate in local Sunday leagues and county cups to build your match count and get observer reports.","Apply for promotion through your County FA referee development programme to reach Step-league matches."],quals:["FA Referee Course (Level 7)","FA Safeguarding in Football","Annual Referee Fitness Assessment"],opps:{text:"Every grassroots match in England needs a referee — demand is constant and year-round. County FAs actively recruit new officials and provide a structured mentoring pathway all the way to the National List and beyond.",links:[{label:"Become a Referee — The FA",url:"https://www.thefa.com/football-rules-governance/referees/become-a-referee"}]}}]},{id:"media",label:"Media & Content",roles:[{title:"Club Content Creator",badge:"INTERNSHIP → PAID",badgeType:"internship",tagline:"You're filming training sessions, editing reels, and building a club's entire social presence — from the inside.",steps:["Film 3 match day videos at a local non-league club and publish them as a portfolio reel on YouTube or Vimeo.","DM 10 National League North/South clubs directly — many post work experience opportunities on their Instagram.","Formalise your skills with an NCTJ Digital Journalism short course or a Level 3 Media qualification."],quals:["NCTJ Digital Journalism Certificate","Level 3 Creative Media Production (BTEC)","Adobe Premiere Pro or CapCut"],opps:{text:"Clubs from Step 3 downward regularly seek content creators — many offer unpaid or expenses-covered placements that lead to paid roles. Your football knowledge and access to players is a genuine differentiator over career changers with no sport background.",links:[{label:"NCTJ Training Courses",url:"https://www.nctj.com/journalism-qualifications"},{label:"Sportcareers.com",url:"https://www.sportcareers.com"}]}},{title:"Sports Journalist / Writer",badge:"INTERNSHIP → PAID",badgeType:"internship",tagline:"You're covering matches, filing post-game reports, and building a byline — starting at non-league level and working your way up.",steps:["Start a football blog or contribute match reports to a non-league club programme — free to do, builds real clips immediately.","Study for an NCTJ Diploma in Journalism (Levels 3 and 4) — the industry-standard entry route into print and digital journalism.","Apply for work experience at local newspapers, BBC Sport regional, or football-specific outlets like The Non-League Paper."],quals:["NCTJ Diploma in Journalism (Levels 3 & 4)","NCTJ Media Law & Regulation","Shorthand 100 wpm (NCTJ requirement)"],opps:{text:"Local newspapers and digital outlets cover non-league football extensively and they consistently need writers who genuinely understand the game. NCTJ-trained reporters are hired directly by national titles, broadcasters, and digital-first outlets.",links:[{label:"NCTJ Journalism Qualifications",url:"https://www.nctj.com/journalism-qualifications"},{label:"Sports Journalists' Association",url:"https://the-sja.org.uk"}]}},{title:"Videographer / Cameraman",badge:"INTERNSHIP → PAID",badgeType:"internship",tagline:"You're behind the lens at training grounds and match days, producing footage clubs, broadcasters, and players actually use.",steps:["Learn the basics: a Sony ZV-E10 or similar entry-level mirrorless camera and DaVinci Resolve (free professional editing software).","Offer to film 5 matches for a local club for free — build a showreel from the best 90 seconds of each match.","Apply to production companies that supply National League and EFL clubs with match-day coverage and highlight packages."],quals:["Level 3 Creative Media Production (BTEC)","Adobe Premiere Pro or DaVinci Resolve","No formal degree required with a strong portfolio"],opps:{text:"Sports videography is one of the fastest-growing freelance careers in football media. EFL clubs and specialist sports production agencies regularly take on short-contract and freelance videographers, with rates rising sharply from Step 3 upward.",links:[{label:"ScreenSkills — Screen Industry Training",url:"https://www.screenskills.com"},{label:"Sportcareers.com",url:"https://www.sportcareers.com"}]}},{title:"Podcast Producer / Presenter",badge:"SELF-EMPLOYED",badgeType:"self-employed",tagline:"You're recording, editing, and publishing football conversations — building an audience and monetising your love of the game.",steps:["Launch a show using Anchor or Buzzsprout (both free) — publish at least 6 episodes before promoting to build a back catalogue.","Drive listenership via 60-second clips on TikTok and Instagram Reels — short video clips consistently outperform audio-only promotion.","Monetise through Patreon, Spotify Podcast Subscriptions, and direct club or brand sponsorship once your audience grows."],quals:["No formal qualification required","Adobe Audition or Audacity (free audio editing)","Basic video editing for social clips"],opps:{text:"Football podcasts built around specific clubs, levels, or communities (National League, Women's football, youth development) consistently attract loyal niche audiences. Many successful shows were started by ex-players with exactly your background — the insight is the product.",links:[{label:"Buzzsprout (free podcast hosting)",url:"https://www.buzzsprout.com"},{label:"Spotify for Podcasters",url:"https://podcasters.spotify.com"}]}},{title:"Match Day Photographer",badge:"VOLUNTEER → PAID",badgeType:"volunteer",tagline:"You're pitchside at kick-off, capturing the moments that end up in the match programme, on the club website, and in the press.",steps:["Start at a local Step 5–7 club — offer to shoot 3 matches for free in exchange for a photo credit and testimonial.","Build a portfolio of 30–40 images on a free Adobe Portfolio or Squarespace page — quality over quantity.","Approach regional newspaper sports desks or non-league clubs directly to negotiate a paid per-match rate."],quals:["No formal qualification required","DSLR or mirrorless camera (entry-level)","Adobe Lightroom for post-processing"],opps:{text:"Non-league clubs commonly pay £50–150 per match day for a reliable photographer. Regional sports news agencies also hire freelancers for specific fixtures, and building your own print sales from non-league action is a growing income stream.",links:[{label:"British Press Photographers' Association",url:"https://www.bppa.org.uk"},{label:"Sportcareers.com",url:"https://www.sportcareers.com"}]}}]},{id:"business",label:"Business & Specialist",roles:[{title:"Football Agent / Intermediary",badge:"SELF-EMPLOYED",badgeType:"self-employed",tagline:"You're negotiating contracts, brokering transfers, and building a client list — your football contacts are your starting capital.",steps:["Pass the FA Intermediary Exam (held annually — study the FIFA and FA Intermediary Regulations thoroughly before sitting).","Register with The FA and pay the annual registration fee (~£500) — without this you cannot legally represent players.","Begin representing players in your existing network, documenting all transactions via the FA's Intermediary portal."],quals:["FA Registered Intermediary Status","FA Intermediary Examination","Clean criminal record (mandatory)"],opps:{text:"Your existing network of teammates and academy contacts is your most valuable asset. Most successful agents started by representing one player and grew from there — the barrier is registration, not experience. The FA publishes a public register of all licensed intermediaries.",links:[{label:"FA Intermediary Registration",url:"https://www.thefa.com/football-rules-governance/intermediaries"},{label:"How to Become an Intermediary",url:"https://www.thefa.com/football-rules-governance/intermediaries/how-to-become-an-intermediary"}]}},{title:"Sports Nutritionist / Performance Chef",badge:"SELF-EMPLOYED",badgeType:"self-employed",tagline:"You're building meal plans for athletes, stocking club kitchens, and becoming the secret weapon behind on-pitch performance.",steps:["Complete a Level 3 Award in Nutrition — available via BTEC, Cache, or NHD-accredited providers, typically 4–6 months.","Specialise with an ISSN Foundation Level Sports Nutrition Certificate or the NHD Sports Nutrition short course.","Approach local academies and non-league clubs directly — most clubs below Championship level have no dedicated nutritionist at all."],quals:["Level 3 Award in Nutrition (BTEC or Cache)","ISSN Foundation Sports Nutrition Certificate","Food Hygiene Level 2","NHD Sports Nutrition Certificate"],opps:{text:"Lower-league clubs and academies rarely have a dedicated nutritionist — this is a genuine gap in the market that a qualified specialist can fill. Offer a free 4-week athlete meal plan trial to a local club to build your portfolio and get a reference that opens doors.",links:[{label:"British Dietetic Association",url:"https://www.bda.uk.com/resource/become-a-dietitian.html"},{label:"ISSN UK",url:"https://www.theissn.org"}]}},{title:"Club Operations / Stadium Manager",badge:"PAID",badgeType:"p
