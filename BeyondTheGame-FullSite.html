anges. No waiting lists."}]},18:{label:"18",caption:"left the academy",title:"Leaving at 18 — your path is still wide open",text:"You've spent your teenage years training, sacrificing, believing. Now you're at a crossroads. It's okay to feel lost. It's okay to feel angry or sad about what you expected your life to look like. And it's also okay to start asking — what else am I? Because there's a lot more to you than football, even if it doesn't feel that way right now.",resources:[{icon:"🎓",title:"University & Higher Ed",text:"Sports science, coaching, physiotherapy, business — your academy background is a genuine asset on any UCAS or apprenticeship application."},{icon:"🔧",title:"Apprenticeships",text:"Earn while you learn in construction, tech, healthcare, business or sport. Employers actively seek the discipline ex-academy players bring."},{icon:"⚽",title:"Keep Playing",text:"Released from a pro academy doesn't mean football is over. We help you find semi-pro, amateur, and recreational clubs that fit your level and ambitions."}]},"21plus":{label:"21+",caption:"left the academy",title:"Years of dedication deserve a real next chapter",text:"You've given your early adult years to this game — and that took genuine sacrifice and belief. You know what early mornings, team pressure, and performing under stress really feel like. Those aren't just football skills. They're exactly the qualities that make employers, coaches, and business owners sit up and pay attention. This is a transition, not an ending.",resources:[{icon:"🏆",title:"Coaching & Badges",text:"UEFA C, B, and A licences, grassroots coaching, academy roles — your playing experience is a massive head start. We'll help you get started."},{icon:"💼",title:"Career Pivot",text:"CV workshops, interview prep, and direct introductions to employers who actively recruit from professional sport backgrounds."},{icon:"💰",title:"Financial Planning",text:"Make the most of any savings, understand your tax position, and plan your next five years with a dedicated financial advisor who understands athletes."}]}},Xm=[{id:"mind",emoji:"🧠",title:"Mind & Wellbeing",text:"Feeling low, anxious, or completely lost is a totally normal response to leaving the academy. We connect you with therapists and peer supporters who actually understand what you're going through — no waiting lists, no jargon.",accent:"var(--c-mind)",bg:"var(--c-mind-bg)"},{id:"money",emoji:"💷",title:"Money & Finances",text:"From benefits you might be entitled to, through budgeting basics, to longer-term financial planning — our guides are written in plain English with no confusing jargon. Know your rights and make your money work harder.",accent:"var(--c-money)",bg:"var(--c-money-bg)"},{id:"feelings",emoji:"❤️",title:"Feelings & Identity",text:"When football is your whole identity and it's suddenly gone, it can feel like losing a part of yourself. This isn't weakness — it's grief. We have peer groups and one-to-one support to help you find yourself beyond the game.",accent:"var(--c-feelings)",bg:"var(--c-feelings-bg)"},{id:"work",emoji:"🎯",title:"Work & Your Future",text:"CV writing, job searching, apprenticeship applications, interview practice — and honest conversations about what kind of work might actually make you happy. Your academy skills translate further than you think.",accent:"var(--c-work)",bg:"var(--c-work-bg)"},{id:"football",emoji:"⚽",title:"Football Exit Support",text:"Understand your rights, navigate the academy release process, get advice on agents and contracts, and explore whether continuing to play at any level is right for you. You don't have to figure this out alone.",accent:"var(--c-football)",bg:"var(--c-football-bg)"},{id:"community",emoji:"🤝",title:"Community & Mates",text:"Connect with hundreds of young people who've been through the same thing. Share your story, find answers, make real friends who understand what you've been through. You are far from alone in this.",accent:"var(--c-community)",bg:"va
